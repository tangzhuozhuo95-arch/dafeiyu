<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dceff9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>大肥鱼的小房间</title><style>
:root{--ink:#20334f;--sub:#7b8ba3;--pink:#ef88bb;--blue:#568bd5}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:var(--ink);background:linear-gradient(145deg,#d9eff9,#e9e1f5 70%,#ffe9f1);min-height:100dvh}.app{max-width:560px;margin:auto;padding:env(safe-area-inset-top) 18px calc(24px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;padding:24px 3px 10px}h1{font-size:23px;margin:0}small{color:var(--sub)}button{font-family:inherit;cursor:pointer;border:0}button:active{transform:scale(.97)}.gear{background:#ffffffa8;border-radius:15px;padding:11px;font-size:19px}.panel{background:#ffffffbd;border:1px solid #fff;border-radius:25px;box-shadow:0 14px 50px #577baa17;padding:16px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{font-size:12px;font-weight:600}.track{height:8px;background:#e8edf6;border-radius:12px;margin-top:7px;overflow:hidden}.fill{height:100%;width:70%;background:linear-gradient(90deg,#78b6ed,#a58ce9);border-radius:12px;transition:width .35s}.room{height:315px;border-radius:23px;position:relative;overflow:hidden;background:linear-gradient(180deg,#bfe3fa 0%,#d9eafa 65%,#f3d9cb 65%,#f2ded0 100%);touch-action:manipulation}.window{position:absolute;left:24px;top:25px;width:85px;height:105px;border:8px solid #fff;border-radius:45px 45px 12px 12px;background:linear-gradient(#91c9f0,#e5f5ff);box-shadow:0 5px 12px #6995bf36}.window:before{content:'✦';position:absolute;top:12px;left:35px;color:white;font-size:23px}.rug{position:absolute;left:10%;right:10%;bottom:4px;height:65px;border-radius:50%;background:#d8accb90}.shelf{position:absolute;right:20px;top:55px;font-size:48px}.hint{position:absolute;top:9px;right:12px;font-size:11px;color:#7392b1}.pet{width:126px;height:173px;position:absolute;left:calc(50% - 63px);bottom:22px;filter:drop-shadow(0 9px 7px #61769a4d);transition:left 1.1s linear;z-index:2;user-select:none;-webkit-user-select:none}.pet.walk{animation:bob .3s ease-in-out infinite alternate}.pet.happy{animation:bounce .36s ease-in-out 3 alternate}@keyframes bob{to{transform:translateY(-5px) rotate(2deg)}}@keyframes bounce{to{transform:translateY(-13px)}}.pet svg{width:100%;height:100%}.bubble{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 12px;border-radius:15px;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis;font-size:13px;box-shadow:0 4px 16px #4c658c20;z-index:3}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border-radius:17px;padding:12px 3px;background:#f2f7ff;color:#355071;font-size:14px;font-weight:600}.action span{display:block;font-size:25px;margin-bottom:4px}.chat-head{display:flex;justify-content:space-between;align-items:center;font-weight:700}.tag{font-size:11px;background:#e4f0ff;color:#487ab7;border-radius:20px;padding:5px 9px}.chat{height:195px;overflow:auto;margin:12px 0;padding:4px;display:flex;flex-direction:column;gap:9px}.msg{padding:10px 13px;border-radius:16px;max-width:85%;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:#ecf2ff;align-self:flex-start}.msg.me{background:#d2f2e3;align-self:flex-end}.send{display:flex;gap:8px}.send input,.settings input{min-width:0;flex:1;padding:12px;background:#f8fbff;border:1px solid #e0e8f2;border-radius:13px;font-size:14px}.send button,.primary{background:#5e91da;color:white;padding:11px 16px;border-radius:13px;font-weight:bold}.settings{display:none}.settings.open{display:block}.settings label{font-size:12px;color:#677992;display:block;margin:11px 0 5px}.settings input{width:100%}.settings p{font-size:12px;color:#687c95;line-height:1.6}.foot{text-align:center;color:#8393ac;font-size:12px;margin:12px}.ghost{background:#e8eefd;border-radius:10px;padding:8px 10px;color:#506c9b}.row{display:flex;gap:9px;align-items:center;margin-top:10px}.row button{flex:1}</style></head><body><main class="app"><header><div><h1>🐋 大肥鱼的小房间</h1><small>你的蓝发小伙伴 · iPhone 版</small></div><button class="gear" id="settingsBtn" aria-label="设置">⚙️</button></header><div class="panel"><div class="stats"><div class="stat">🍰 饱食 <span id="foodN">80</span><div class="track"><div class="fill" id="foodBar"></div></div></div><div class="stat">💗 心情 <span id="moodN">80</span><div class="track"><div class="fill" id="moodBar"></div></div></div><div class="stat">✨ 好感 <span id="bondN">20</span><div class="track"><div class="fill" id="bondBar"></div></div></div></div></div><div class="panel"><div class="room" id="room"><div class="window"></div><div class="shelf">🪴</div><div class="hint">点小鱼可摸头</div><div class="rug"></div><div class="bubble" id="bubble">今天也要陪我玩呀～</div><div class="pet" id="pet"><svg viewBox="0 0 126 173" xmlns="http://www.w3.org/2000/svg"><ellipse cx="63" cy="160" rx="35" ry="9" fill="#6d7296" opacity=".22"/><path d="M31 69 Q9 45 23 21 Q51 -7 80 18 Q118 17 108 74 L116 115 Q106 142 90 126 L36 126 Q10 150 10 111Z" fill="#1e386e"/><path d="M18 40 Q0 54 15 79 Q3 99 21 123" stroke="#335a9c" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M104 37 Q128 55 113 80 Q126 106 108 125" stroke="#335a9c" stroke-width="16" stroke-linecap="round" fill="none"/><path d="M35 105 L25 149 Q63 168 101 149 L89 105Z" fill="#243351"/><path d="M40 110 Q62 134 86 110 L91 149 Q64 160 35 149Z" fill="#f6eaf3"/><path d="M55 130 Q63 141 73 130" fill="none" stroke="#7cb3e3" stroke-width="5"/><rect x="40" y="146" width="15" height="17" rx="6" fill="#222b48"/><rect x="72" y="146" width="15" height="17" rx="6" fill="#222b48"/><path d="M39 88 Q20 102 29 119" stroke="#f6d2cf" stroke-width="11" stroke-linecap="round"/><path d="M89 88 Q108 103 98 119" stroke="#f6d2cf" stroke-width="11" stroke-linecap="round"/><ellipse cx="63" cy="70" rx="39" ry="44" fill="#f5d5d4"/><path d="M23 73 Q19 10 65 11 Q109 8 103 75 L88 50 L79 65 L68 46 L57 66 L42 48Z" fill="#213b76"/><path d="M34 37 Q52 18 69 31 M71 28 Q86 22 95 38" stroke="#3c61a3" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M42 84 Q50 78 56 84 M71 84 Q78 78 86 84" stroke="#30334f" stroke-width="3.6" stroke-linecap="round" fill="none"/><ellipse cx="38" cy="92" rx="9" ry="5" fill="#ee9eaa" opacity=".65"/><ellipse cx="88" cy="92" rx="9" ry="5" fill="#ee9eaa" opacity=".65"/><path d="M60 94 Q63 98 66 94" stroke="#a9617e" stroke-width="2" fill="none"/><path d="M31 34 Q39 17 51 18 M78 16 Q92 17 99 31" stroke="#e5d7e5" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="105" cy="50" r="9" fill="#75b7ef"/><path d="M98 44 L112 56 M112 44 L98 56" stroke="#d6eeff" stroke-width="3"/></svg></div></div><div class="actions"><button class="action" id="feed"><span>🧁</span>喂食</button><button class="action" id="pat"><span>🫳</span>摸头</button><button class="action" id="play"><span>🪀</span>陪玩</button></div></div><div class="panel"><div class="chat-head"><span>💬 和大肥鱼聊天</span><span class="tag" id="mode">演示模式</span></div><div class="chat" id="chat"></div><form class="send" id="chatForm"><input id="message" placeholder="今天想跟小鱼聊什么？" autocomplete="off" maxlength="1500"><button>发送</button></form></div><div class="panel settings" id="settings"><b>⚙️ AI 中转连接</b><p>不连接时也能喂食和陪玩。连接 Cloudflare Worker 代理后才会使用你的 AI 中转模型。<b>不要在此输入中转 API Key。</b></p><label>Worker 地址（https://xxx.workers.dev）</label><input id="endpoint" placeholder="https://你的代理.workers.dev"><label>访问口令（由你在 Worker 里单独设置，不是 API Key）</label><input id="token" type="password" placeholder="你的访问口令"><div class="row"><button class="primary" id="save" type="button">保存连接</button><button class="ghost" id="disconnect" type="button">关闭 AI</button></div><p>宠物状态和聊天记录保存在这台手机的浏览器中。访问口令只在当前标签页会话保存，关闭后可能需要重新输入。</p></div><div class="foot">Made for your little blue fish · V1.0</div></main><script>
const $=id=>document.getElementById(id);const key='fish-pet-v1';const initial={food:80,mood:80,bond:20,history:[{role:'assistant',content:'欢迎回家！我是你的大肥鱼～今天要先摸摸头，还是给我一块小蛋糕？'}]};let state;try{state=Object.assign({},initial,JSON.parse(localStorage.getItem(key)||'{}'))}catch{state={...initial}};state.history=Array.isArray(state.history)?state.history:initial.history;let pos=50;let busy=false;let endpoint=localStorage.getItem('fish-endpoint')||'';let token=sessionStorage.getItem('fish-token')||'';function persist(){localStorage.setItem(key,JSON.stringify(state))}function render(){for(const x of ['food','mood','bond']){$(x+'N').textContent=Math.round(state[x]);$(x+'Bar').style.width=state[x]+'%'}$('mode').textContent=endpoint&&token?'AI 已连接':'演示模式';$('chat').innerHTML='';for(const m of state.history.slice(-28)){const el=document.createElement('div');el.className='msg'+(m.role==='user'?' me':'');el.textContent=m.content;$('chat').append(el)}$('chat').scrollTop=$('chat').scrollHeight;persist()}function say(s){$('bubble').textContent=s;setTimeout(()=>{if($('bubble').textContent===s)$('bubble').textContent='♪'},3400)}function happy(s){say(s);$('pet').classList.add('happy');setTimeout(()=>$('pet').classList.remove('happy'),1100);render()}function add(n,k){state[k]=Math.max(0,Math.min(100,state[k]+n))}function act(kind){if(kind==='feed'){add(15,'food');add(3,'bond');happy('啊呜！好好吃～ 🧁')}if(kind==='pat'){add(12,'mood');add(4,'bond');happy('嘿嘿，最喜欢你啦 ♡')}if(kind==='play'){add(15,'mood');add(6,'bond');add(-6,'food');happy('再玩一次嘛！ ✨')}}$('feed').onclick=()=>act('feed');$('pat').onclick=()=>act('pat');$('play').onclick=()=>act('play');$('pet').onclick=()=>act('pat');function walk(){if($('pet').classList.contains('happy'))return;pos=15+Math.random()*70;$('pet').style.left=`calc(${pos}% - 63px)`;$('pet').classList.add('walk');setTimeout(()=>$('pet').classList.remove('walk'),1100)}setInterval(walk,3500);setInterval(()=>{add(-1,'food');render()},240000);$('settingsBtn').onclick=()=>{const s=$('settings');s.classList.toggle('open');s.scrollIntoView({behavior:'smooth',block:'nearest'})};$('endpoint').value=endpoint;$('token').value=token;$('save').onclick=()=>{endpoint=$('endpoint').value.trim().replace(/\/$/,'');token=$('token').value.trim();if(endpoint&&!/^https:\/\//.test(endpoint)){alert('Worker 地址必须以 https:// 开头');return}localStorage.setItem('fish-endpoint',endpoint);sessionStorage.setItem('fish-token',token);render();alert(endpoint&&token?'已保存，下一条消息将调用 AI':'尚未填写完整，继续使用演示模式')};$('disconnect').onclick=()=>{endpoint='';token='';localStorage.removeItem('fish-endpoint');sessionStorage.removeItem('fish-token');$('endpoint').value='';$('token').value='';render()};function demoReply(s){if(/饿|吃|蛋糕|喂/.test(s))return '大肥鱼想吃草莓蛋糕！可以点一下「喂食」吗？';if(/喜欢|爱/.test(s))return '喜欢！超级喜欢！我的好感度都要冒泡泡啦～ 🫧';if(/你好|嗨|哈喽/.test(s))return '你好呀！今天的你也闪闪发光。要来摸摸我的头吗？';return ['我听见啦！虽然我还没连上 AI，但会一直在小房间等你～','小鱼正在转圈思考中……先给我一颗糖好吗？','今天也想和你待在一起呢。接上 AI 后就能自由聊天啦！'][Math.floor(Math.random()*3)]} $('chatForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const s=$('message').value.trim();if(!s)return;$('message').value='';state.history.push({role:'user',content:s});render();busy=true;let reply='';if(endpoint&&token){$('mode').textContent='思考中…';try{const response=await fetch(endpoint+'/chat',{method:'POST',headers:{'content-type':'application/json','x-pet-token':token},body:JSON.stringify({messages:state.history.slice(-20)})});const data=await response.json();if(!response.ok)throw Error(data.error||'HTTP '+response.status);reply=String(data.reply||'').trim();if(!reply)throw Error('模型未返回文字')}catch(err){reply='连接失败：'+err.message+'。检查 Worker 地址、访问口令和模型配置。'}}else reply=demoReply(s);state.history.push({role:'assistant',content:reply});if(state.history.length>80)state.history=state.history.slice(-80);add(2,'bond');say(reply.length>20?reply.slice(0,19)+'…':reply);busy=false;render()};render();walk();
</script></body></html>
